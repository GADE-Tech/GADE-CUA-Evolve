llm:
  provider: openai
  model: qwen/qwen3.5-27b
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  base_url_env: null
  max_tokens: 4096
  temperature: 0.0
  top_p: 0.9
  max_retries: 5
agent:
  name: qwen3vl
  history_n: 4
  coordinate_type: relative
  platform: ubuntu
  image:
    factor: 32
    max_pixels: 13107200
  dump_messages: false
env:
  name: noop
  headless: true
  screen_size: [1280, 720]
  require_a11y_tree: false
  boot_wait_seconds: 0
loop:
  name: react
  max_steps: 15
  sleep_after_action: 2.0
  output_dir: results
