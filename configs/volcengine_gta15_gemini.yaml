llm:
  provider: google
  model: gemini-3.5-flash-lite
  model_env: GEMINI_MODEL
  api_key_env: GEMINI_AK
  base_url_env: null
  max_tokens: 16384
  temperature: 0.0
  top_p: 0.9
  max_retries: 10
grounder:
  provider: google
  model: gemini-3.5-flash-lite
  model_env: GEMINI_MODEL
  api_key_env: GEMINI_AK
  base_url_env: null
  max_tokens: 512
  max_retries: 5
  max_turns: 5
  semantic_retries: 3
  crop_radius: 200
arm:
  llm:
    provider: google
    model: gemini-3.5-flash-lite
    model_env: GEMINI_MODEL
    api_key_env: GEMINI_AK
    base_url_env: null
    max_tokens: 16384
    max_retries: 5
  actor_steps_per_episode: 5
  max_episodes: 3
  max_judge_steps: 15
  judge_pause: 0.3
  enable_code_inspection: true
  code_timeout: 60
  enable_trajectory_check: true
  trajectory_max_images: 12
agent:
  name: gta15
  history_n: 8
  coordinate_type: relative
  platform: ubuntu
  internal_retries: 3
  dump_messages: false
env:
  name: osworld
  provider_name: volcengine
  region: ap-southeast-1
  # Allocate a disposable instance from VOLCENGINE_IMAGE_ID for every run.
  path_to_vm: null
  snapshot_name: image-yery9soico9at9tlox9v
  action_space: pyautogui
  headless: true
  screen_size: [1920, 1080]
  require_a11y_tree: false
  require_terminal: false
  os_type: Ubuntu
  boot_wait_seconds: 0
loop:
  name: react
  max_steps: 15
  sleep_after_action: 0.3
  settle_seconds: 20
  output_dir: results
  record_video: true
