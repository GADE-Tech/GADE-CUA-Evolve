[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gade-cua-evolve"
version = "0.1.0"
description = "GADE CUA Evolve project configuration."
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "GADE CUA Evolve contributors" }
]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "pyautogui>=0.9.54",
]

[project.optional-dependencies]
openai = [
  "openai>=1.0",
]
google = [
  "google-generativeai>=0.8",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
pretty = true
