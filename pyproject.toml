[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gade-cua-evolve"
version = "0.1.0"
description = "GADE CUA Evolve"
requires-python = ">=3.10"
dependencies = [
    "backoff>=2.2",
    "pillow>=10",
    "pydantic>=2",
    "python-dotenv>=1",
    "pyyaml>=6",
    "textual>=8.2,<9",
    "typer>=0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
google = ["google-genai>=1.0.0"]
osworld = []
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
gade-cua = "gade_cua_evolve.cli:app"
gadecua = "gade_cua_evolve.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
